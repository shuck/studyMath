<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学题生成器 (H5 版)</title>
<style>
    * {
        box-sizing: border-box;
    }
    
    body { 
        font-family: "Microsoft YaHei", "SimHei", sans-serif; 
        padding: 20px;
        margin: 0 auto;
        width: 210mm;
        text-align: center;
    }
    
    .controls { 
        margin: 0 auto 20px auto;
        padding: 15px; 
        background: #f5f5f5; 
        border-radius: 8px;
        width: 100%;
        text-align: left;
    }
    .controls input { padding: 8px; width: 100px; margin-right: 10px; }
    .controls button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .controls button:hover { background: #0056b3; }
    
    /* 题目区域样式 */
    #problem-container { 
        display: none;
        width: 100%;
        margin: 0 auto;
        padding: 10px;
        text-align: center;
    }
    .header-info { 
        text-align: center; 
        margin-bottom: 10px; 
        font-size: 14px; 
    }
    
    /* 一行四列 - 口算题区域 */
    .problem-grid { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr);
        gap: 8px 5px;
        width: 100%;
        padding-left: 30px;
    }
    .problem-item { 
        font-size: 17px;
        height: 28px;
        line-height: 28px;
        text-align: left;
        /* 新增：确保下划线字符显示正常，pre-wrap允许换行但保留空格/下划线 */
        white-space: pre-wrap; 
        /* 如果希望下划线更长，可以在JS里多加几个下划线，或者这里增加字间距 */
        letter-spacing: 0.5px;
    }
    
    /* 竖式计算区域 - 改为横式 */
    .vertical-section { 
        margin-top: 5px;
        margin-bottom: 100px;
        border-top: none;
        padding-top: 20px; 
        padding-bottom: 30px;
        page-break-inside: avoid;
    }
    .vertical-title { 
        font-weight: bold; 
        font-size: 15px; 
        margin-bottom: 5px;
        text-align: left;
    }
    .vertical-grid { 
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px 40px;
    }
    .vertical-item { 
        font-size: 17px; 
        line-height: 2.8;
        text-align: left;
        padding-left: 20px;
        padding-bottom: 90px;
        min-height: 130px;
    }
    
    /* 除法竖式专用样式 */
    .division-section {
        margin-top: 100px;
        margin-bottom: 50px;
        border-top: none;
        padding-top: 25px;
        padding-bottom: 25px;
        page-break-inside: avoid;
    }
    .division-title {
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 10px;
        text-align: left;
    }
    .division-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px 40px;
    }
    .division-item {
        font-size: 17px;
        line-height: 3;
        text-align: left;
        padding-left: 20px;
    }

    /* 数独专用样式 */
    .sudoku-section {
        margin-top: 5px;
    }
    .sudoku-title {
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 10px;
        text-align: center;
    }
    .sudoku-grid {
        border-collapse: collapse;
        margin: 0 auto;
        table-layout: fixed;
    }
    .sudoku-grid td {
        border: 1px solid #bbb;
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
        padding: 0;
        aspect-ratio: 1;
    }
    .sudoku-grid td.box-left { border-left: 3px solid #333; }
    .sudoku-grid td.box-top { border-top: 3px solid #333; }
    .sudoku-grid td.given { color: #000; }
    .sudoku-grid td.blank { background: #fff; }
    .sudoku-controls { margin-top: 10px; display: none; }

    /* 打印专用样式 */
    @media print {
        .controls { display: none; }
        #problem-container { 
            display: block !important;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body { 
            padding: 0; 
            margin: 0;
            width: 100%;
            max-width: none;
        }
        .problem-grid { 
            gap: 4px 4px;
            padding-left: 15px;
            margin-bottom: 3mm;
        }
        .problem-item {
            height: 26px;
            line-height: 26px;
            font-size: 14px;
        }
        .header-info {
            margin-bottom: 3mm;
            font-size: 13px;
            padding-bottom: 5px;
        }
        
        /* 竖式计算区域 - 打印优化 */
        .vertical-section {
            margin-top: 1mm;
            margin-bottom: 1mm;
            padding-top: 2mm;
            padding-bottom: 3mm;
            border-top: none;
        }
        .vertical-title {
            font-size: 12px;
            margin-bottom: 0.5mm;
        }
        .vertical-grid {
            gap: 5mm 30px;
        }
        .vertical-item {
            font-size: 13px;
            line-height: 2.0;
            padding-bottom: 25px;
            min-height: 80px;
        }
        
        /* 除法竖式区域 - 打印优化 */
        .division-section {
            margin-top: 5mm;
            margin-bottom: 5mm;
            padding-top: 5mm;
            padding-bottom: 12mm;
            border-top: none;
        }
        .division-title {
            font-size: 15px;
            margin-bottom: 1mm;
        }
        .division-grid {
            gap: 12mm 50px;
        }
        .division-item {
            font-size: 16px;
            line-height: 2.8;
        }

        /* 数独打印样式 */
        .sudoku-section {
            margin-top: 3mm;
        }
        .sudoku-title {
            font-size: 11px;
            margin-bottom: 0;
        }
        .sudoku-grid {
        }
        .sudoku-grid td {
            font-size: 18pt !important;
        }
        
        @page {
            margin: 5mm;
            size: A4;
        }
        
        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }
</style>
</head>
<body>

<div class="controls" style="margin: 0 auto; width: 210mm;">
    <h3>🛠️ 设置面板</h3>
    <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:center;">
      <div><label>口算题数：</label><input type="number" id="oralCount" value="32" min="1" max="999"></div>
      <div><label>竖式题数：</label><input type="number" id="verticalCount" value="4" min="0" max="8"></div>
      <label><input type="checkbox" id="sudokuToggle" onchange="toggleSudoku()" checked> 包含数独</label>
      <span class="sudoku-controls" id="sudokuControls">
        <label>尺寸：</label>
        <select id="sizeSelect">
          <option value="4">4×4</option>
          <option value="6">6×6</option>
          <option value="9" selected>9×9</option>
        </select>
        <label>难度：</label>
        <select id="difficultySelect">
          <option value="easy" selected>简单</option>
          <option value="medium">中等</option>
          <option value="hard">困难</option>
        </select>
        <label>偏移：</label>
        <input type="number" id="sudokuOffset" value="0" min="-100" max="100" style="width:60px"> mm
      </span>
      <button onclick="generateAndPrint()">生成并下载 PDF</button>
    </div>
    <p style="font-size: 12px; color: #666; margin-top: 5px;">
        * 打印时请<b>取消勾选"页眉和页脚"</b>选项，以确保无页脚输出
    </p>
</div>

<div id="problem-container">
    <div class="header-info">
        姓名：________________ &nbsp;&nbsp;&nbsp; 日期：________________ &nbsp;&nbsp;&nbsp; 用时：________________
    </div>
    <div class="problem-grid" id="problemGrid"></div>
    
    <div class="vertical-section">
        <div class="vertical-title">万以内加减法（竖式计算）：</div>
        <div class="vertical-grid" id="verticalGrid"></div>
    </div>


    <div class="sudoku-section" id="sudokuSection" style="display:none;">
        <div class="sudoku-title" id="sudokuTitle">9×9 数独</div>
        <table class="sudoku-grid" id="sudokuGrid"></table>
    </div>

</div>

<script>
    // 工具函数：生成范围内的随机整数
    function randint(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 预先生成乘法口诀表范围内的除法题示例
    let multiplicationTableDivisions = [];
    function initDivisionData() {
        multiplicationTableDivisions = [];
        for (let divisor = 2; divisor < 10; divisor++) {
            for (let quotient = 2; quotient < 10; quotient++) {
                let dividend = divisor * quotient;
                if (dividend >= 2 && dividend <= 81) {
                    multiplicationTableDivisions.push({ dividend, divisor, quotient });
                }
            }
        }
    }

    // 核心逻辑：生成题目
    function generateMathProblems(oralCount = 60, verticalCount = 4) {
        const MAX_ORAL = 999, MAX_VERTICAL = 8;
        if (oralCount > MAX_ORAL) {
            oralCount = MAX_ORAL;
            alert(`口算题数已自动调整为${MAX_ORAL}道，以确保一页能放下`);
        }
        if (verticalCount > MAX_VERTICAL) {
            verticalCount = MAX_VERTICAL;
            alert(`竖式题数已自动调整为${MAX_VERTICAL}道，以确保一页能放下`);
        }
        
        let problems = [];
        let seenProblems = new Set();
        
        const problemTypes = [
            { type: 'two_num_add', weight: 10 },
            { type: 'two_num_sub', weight: 10 },
            { type: 'multiply', weight: 8 },
            { type: 'divide', weight: 6 },
            { type: 'remainder_divide', weight: 10 },
            { type: 'fill_missing_large', weight: 8 },
            { type: 'large_add_sub', weight: 8 },
            { type: 'mixed_three', weight: 3 },
            { type: 'comparison_expr', weight: 1 }
        ];

        let typeQueue = [];
        problemTypes.forEach(item => {
            if (item.weight > 0) {
                for (let i = 0; i < item.weight; i++) typeQueue.push(item.type);
            }
        });

        typeQueue.sort(() => Math.random() - 0.5);

        let queueIndex = 0;
        while (problems.length < oralCount) {
            if (queueIndex >= typeQueue.length) {
                typeQueue.sort(() => Math.random() - 0.5);
                queueIndex = 0;
            }

            let operation = typeQueue[queueIndex];
            queueIndex++;

            let problem = null;
            let attempts = 0;
            const maxAttempts = 10;

            while ((problem === null || seenProblems.has(problem)) && attempts < maxAttempts) {
                attempts++;
                problem = createSingleProblem(operation);
            }

            if (problem && !seenProblems.has(problem)) {
                problems.push(problem);
                seenProblems.add(problem);
            }
        }

        // 生成竖式题目
        let verticalProblems = [];
        for (let i = 0; i < verticalCount; i++) {
            let isAdd = Math.random() > 0.5;
            if (isAdd) {
                let n1 = randint(1000, 8999);
                let n2 = randint(100, 9999 - n1);
                verticalProblems.push({ type: 'add', num1: n1, num2: n2 });
            } else {
                let n1 = randint(2000, 9999);
                let n2 = randint(100, n1);
                verticalProblems.push({ type: 'sub', num1: n1, num2: n2 });
            }
        }

        return { problems, verticalProblems };
    }

        // 生成单道题目
    function createSingleProblem(operation) {
        if (operation === 'two_num_add') {
            let a = randint(2, 99);
            let b = randint(2, 100 - a);
            if (b < 2) return null;
            return `${a} + ${b} =`;
        
        } else if (operation === 'two_num_add_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let a = randint(2, 99);
            let b = randint(2, 100 - a);
            if (b < 2) return null;
            return fillPosition === 'first' ? `______ + ${b} = ${a + b}` : `${a} + ______ = ${a + b}`;

        } else if (operation === 'two_num_sub') {
            let a = randint(3, 100);
            let b = randint(2, a - 1);
            if (b < 2) return null;
            return `${a} - ${b} =`;
        
        } else if (operation === 'two_num_sub_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let a = randint(3, 100);
            let b = randint(2, a - 1);
            if (b < 2) return null;
            return fillPosition === 'first' ? `______ - ${b} = ${a - b}` : `${a} - ______ = ${a - b}`;

        } else if (operation === 'multiply') {
            let m1 = randint(2, 9);
            let m2 = randint(2, 9);
            return `${m1} × ${m2} =`;
        
        } else if (operation === 'multiply_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let m1 = randint(2, 9);
            let m2 = randint(2, 9);
            let res = m1 * m2;
            return fillPosition === 'first' ? `${m1} × ______ = ${res}` : `______ × ${m2} = ${res}`;

        } else if (operation === 'divide') {
            if (multiplicationTableDivisions.length === 0) return null;
            let item = multiplicationTableDivisions[randint(0, multiplicationTableDivisions.length - 1)];
            return `${item.dividend} ÷ ${item.divisor} =`;
        
        } else if (operation === 'divide_fill') {
            if (multiplicationTableDivisions.length === 0) return null;
            let item = multiplicationTableDivisions[randint(0, multiplicationTableDivisions.length - 1)];
            let pos = Math.random();
            if (pos < 0.33) return `______ ÷ ${item.divisor} = ${item.quotient}`;
            else if (pos < 0.66) return `${item.dividend} ÷ ______ = ${item.quotient}`;
            else return `${item.dividend} ÷ ${item.divisor} = ______`;
        
        } else if (operation === 'remainder_divide') {
            let divisor = randint(2, 9);
            let quotient = randint(2, 9);
            let remainder = randint(1, divisor - 1);
            let dividend = divisor * quotient + remainder;
            return `${dividend} ÷ ${divisor} = ______`;
        
        } else if (operation === 'large_add_sub') {
            let isAdd = Math.random() > 0.5;
            let useRound = Math.random() > 0.4;
            if (isAdd) {
                if (useRound) {
                    let n1 = (randint(0, 8) + 1) * 1000;
                    let n2 = randint(1, 9) * 100;
                    if (Math.random() > 0.5) n2 = randint(1, 9) * 1000;
                    return `${n1} + ${n2} =`;
                } else {
                    let n1 = randint(100, 900);
                    let n2 = randint(100, 900);
                    return `${n1} + ${n2} =`;
                }
            } else {
                if (useRound) {
                    let n1 = (randint(0, 8) + 1) * 1000;
                    let n2 = randint(1, 9) * 100;
                    if (n2 > n1) n2 = randint(1, Math.floor(n1 / 100) - 1) * 100;
                    if (n2 < 100) n2 = 100;
                    return `${n1} - ${n2} =`;
                } else {
                    let n1 = randint(300, 999);
                    if (Math.random() > 0.5) n1 = randint(1000, 9000);
                    let n2 = randint(100, n1);
                    return `${n1} - ${n2} =`;
                }
            }

        } else if (operation === 'fill_missing_large') {
            let useAdd = Math.random() > 0.5;
            let fillPos = randint(0, 2);
            if (useAdd) {
                let a = randint(1, 9) * 1000;
                if (Math.random() > 0.5) a = randint(1, 9) * 100;
                let b = randint(1, 9) * 100;
                if (Math.random() > 0.5) b = randint(1, 9) * 1000;
                let res = a + b;
                if (res > 9999) { a = Math.floor(a / 2); b = Math.floor(b / 2); res = a + b; }
                if (fillPos === 0) return `______ + ${b} = ${res}`;
                else if (fillPos === 1) return `${a} + ______ = ${res}`;
                else return `${a} + ${b} = ______`;
            } else {
                let a = randint(2, 9) * 1000;
                if (Math.random() > 0.5) a = randint(2, 9) * 100;
                let b = randint(1, 9) * 100;
                if (b >= a) b = randint(1, Math.round(a / 100) - 1) * 100;
                if (b < 100) b = 100;
                let res = a - b;
                if (fillPos === 0) return `______ - ${b} = ${res}`;
                else if (fillPos === 1) return `${a} - ______ = ${res}`;
                else return `${a} - ${b} = ______`;
            }
        }
        
        else if (operation === 'mixed_three') {
             let pattern = Math.random() > 0.5 ? '+-' : '-+';
            if (pattern === '+-') {
                let a = randint(2, 70);
                let b = randint(2, Math.min(30, 100 - a));
                let c = randint(2, Math.min(30, a + b));
                return `${a} + ${b} - ${c} =`;
            } else {
                let a = randint(10, 70);
                let b = randint(2, Math.min(30, a));
                let cMax = Math.min(30, 100 - (a - b));
                let c = cMax > 1 ? randint(2, cMax) : 0;
                return c > 0 ? `${a} - ${b} + ${c} =` : `${a} - ${b} =`;
            }
        } else if (operation === 'comparison_expr') {
            let v1 = randint(10, 90);
            let v2 = randint(10, 90);
            return `${v1} + ${randint(2,9)} ◯ ${v2} - ${randint(2,9)}`;
        } else if (operation === 'compare_num_expr') {
            let val = randint(10, 90);
            let num = val + randint(-3, 3);
            return Math.random() > 0.5 ? `${num} ○ ${val} + ${randint(1,5)}` : `${val} + ${randint(1,5)} ○ ${num}`;
        }
        return null;
    }
    // 渲染加减法竖式题目（留空写竖式）
    function renderVerticalProblems(verticalProblems) {
        const vGrid = document.getElementById('verticalGrid');
        vGrid.innerHTML = '';
        
        verticalProblems.forEach(prob => {
            let container = document.createElement('div');
            container.className = 'vertical-item';
            
            if (prob.type === 'add') {
                let op = '+';
                let n1 = prob.num1;
                let n2 = prob.num2;
                container.innerHTML = `${n1} ${op} ${n2} = ________`;
            } else if (prob.type === 'sub') {
                let op = '-';
                let n1 = prob.num1;
                let n2 = prob.num2;
                container.innerHTML = `${n1} ${op} ${n2} = ________`;
            }
            
            vGrid.appendChild(container);
        });
    }

    // 渲染题目到页面
    function renderProblems(problems, verticalProblems) {
        const grid = document.getElementById('problemGrid');
        grid.innerHTML = '';
        problems.forEach(p => {
            let div = document.createElement('div');
            div.className = 'problem-item';
            div.textContent = p;
            grid.appendChild(div);
        });

        renderVerticalProblems(verticalProblems);

        document.getElementById('problem-container').style.display = 'block';
    }

    // 主流程：生成并触发打印
    function generateAndPrint() {
        // 初始化除法数据
        initDivisionData();
        
        // 获取用户输入的题目数量
        let oralCount = parseInt(document.getElementById('oralCount').value) || 32;
        let verticalCount = parseInt(document.getElementById('verticalCount').value) || 4;
        if (verticalCount > 8) { verticalCount = 8; alert('竖式题数上限为8道'); }
        
        const genSudoku = document.getElementById('sudokuToggle').checked;
        
        // 生成所有类型的题目，包括口算和竖式
        const { problems, verticalProblems } = generateMathProblems(oralCount, verticalCount);
        
        // 渲染题目到页面
        renderProblems(problems, verticalProblems);
        
        // 处理数独
        const sudokuSection = document.getElementById('sudokuSection');
        if (genSudoku) {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const difficulty = document.getElementById('difficultySelect').value;
            const offset = parseInt(document.getElementById('sudokuOffset').value) || 0;
            const solution = generateSudokuSolution(size);
            const puzzle = createSudokuPuzzle(solution, size, difficulty);
            renderSudoku(puzzle, size, difficulty);
            sudokuSection.style.display = '';
            sudokuSection.style.marginTop = (offset + 3) + 'mm';
        } else {
            sudokuSection.style.display = 'none';
        }
        
        // 延迟触发打印，确保DOM完全渲染
        setTimeout(() => {
            window.print();
        }, 500);
    }

    /** 估算打印高度，返回一页能容纳的最大口算题数 */
    function calcMaxOral(verticalCount, hasSudoku) {
        const PAGE_MM = 287; // A4 - 2*5mm margins
        const SAFETY_MM = hasSudoku ? 25 : 5;
        
        let used = 8; // header
        
        // 竖式计算区
        if (verticalCount > 0) {
            const vRows = Math.ceil(verticalCount / 2);
            used += 8;  // section margin/padding: 1+2+3+2
            used += 3;  // title
            used += vRows * 21; // item height (80px ≈ 21mm)
            used += (vRows - 1) * 5; // row gap
        }
        
        // 数独区
        if (hasSudoku) {
            used += 3;  // title
            used += 159; // grid (600px ≈ 159mm)
        }
        
        const oralPerRow = 6.4; // 20px + 4px gap
        const available = PAGE_MM - used - SAFETY_MM;
        const maxRows = Math.floor(available / oralPerRow);
        return Math.max(0, maxRows * 4);
    }

    // ========== 数独相关函数 ==========

    function toggleSudoku() {
        document.getElementById('sudokuControls').style.display =
            document.getElementById('sudokuToggle').checked ? 'inline' : 'none';
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getBoxSize(size) {
        switch (size) {
            case 4: return [2, 2];
            case 6: return [2, 3];
            case 8: return [2, 4];
            case 9: return [3, 3];
            default: return [3, 3];
        }
    }

    const BLANK_RANGES = {
        4:  { easy: [4, 5],   medium: [6, 8],   hard: [9, 10] },
        6:  { easy: [10, 13], medium: [16, 20], hard: [22, 26] },
        8:  { easy: [18, 22], medium: [28, 34], hard: [38, 44] },
        9:  { easy: [24, 30], medium: [36, 42], hard: [48, 54] },
    };

    function isValid(grid, row, col, num, boxRows, boxCols) {
        const size = grid.length;
        for (let c = 0; c < size; c++) { if (grid[row][c] === num) return false; }
        for (let r = 0; r < size; r++) { if (grid[r][col] === num) return false; }
        const br = Math.floor(row / boxRows) * boxRows;
        const bc = Math.floor(col / boxCols) * boxCols;
        for (let r = br; r < br + boxRows; r++) {
            for (let c = bc; c < bc + boxCols; c++) {
                if (grid[r][c] === num) return false;
            }
        }
        return true;
    }

    function solveSudoku(grid, boxRows, boxCols) {
        const size = grid.length;
        for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
                if (grid[row][col] === 0) {
                    const candidates = shuffle(Array.from({ length: size }, (_, i) => i + 1));
                    for (const num of candidates) {
                        if (isValid(grid, row, col, num, boxRows, boxCols)) {
                            grid[row][col] = num;
                            if (solveSudoku(grid, boxRows, boxCols)) return true;
                            grid[row][col] = 0;
                        }
                    }
                    return false;
                }
            }
        }
        return true;
    }

    function generateSudokuSolution(size) {
        const [boxRows, boxCols] = getBoxSize(size);
        const grid = Array.from({ length: size }, () => Array(size).fill(0));
        solveSudoku(grid, boxRows, boxCols);
        return grid;
    }

    function createSudokuPuzzle(solution, size, difficulty) {
        const puzzle = solution.map(row => [...row]);
        const [minB, maxB] = BLANK_RANGES[size][difficulty];
        const targetBlanks = randint(minB, maxB);
        const positions = [];
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) { positions.push([r, c]); }
        }
        shuffle(positions);
        const removed = new Set();
        for (const [r, c] of positions) {
            if (removed.size >= targetBlanks) break;
            const key = `${r},${c}`;
            if (removed.has(key)) continue;
            puzzle[r][c] = 0;
            removed.add(key);
            const sr = size - 1 - r;
            const sc = size - 1 - c;
            const skey = `${sr},${sc}`;
            if (!removed.has(skey) && removed.size < targetBlanks) {
                puzzle[sr][sc] = 0;
                removed.add(skey);
            }
        }
        return puzzle;
    }

    function renderSudoku(puzzle, size, difficulty) {
        const [boxRows, boxCols] = getBoxSize(size);
        const grid = document.getElementById('sudokuGrid');
        grid.innerHTML = '';
        grid.style.border = '3px solid #333';

        const maxScreenWidth = Math.min(window.innerWidth * 0.85, 600);
        const cellSize = Math.floor(maxScreenWidth / size);
        grid.style.width = (cellSize * size) + 'px';

        const diffLabels = { easy: '简单', medium: '中等', hard: '困难' };
        document.getElementById('sudokuTitle').textContent =
            `${size}×${size} 数独（${diffLabels[difficulty]}）`;

        for (let r = 0; r < size; r++) {
                const tr = document.createElement('tr');
                tr.style.height = cellSize + 'px';
                for (let c = 0; c < size; c++) {
                const td = document.createElement('td');
                td.style.width = cellSize + 'px';
                td.style.fontSize = Math.max(12, cellSize * 0.45) + 'px';
                if (c % boxCols === 0) td.classList.add('box-left');
                if (r % boxRows === 0) td.classList.add('box-top');
                if (puzzle[r][c] !== 0) {
                    td.textContent = puzzle[r][c];
                    td.classList.add('given');
                } else {
                    td.classList.add('blank');
                }
                tr.appendChild(td);
            }
            grid.appendChild(tr);
        }
    }

    // 初始化
    initDivisionData();
    toggleSudoku();
</script>
