<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学题生成器 (H5 版)</title>
<style>
    * {
        box-sizing: border-box;
    }
    
    body { 
        font-family: "Microsoft YaHei", "SimHei", sans-serif; 
        padding: 20px;
        margin: 0 auto;
        width: 210mm;
        text-align: center;
    }
    
    .controls { 
        margin: 0 auto 20px auto;
        padding: 15px; 
        background: #f5f5f5; 
        border-radius: 8px;
        width: 100%;
        text-align: left;
    }
    .controls input { padding: 8px; width: 100px; margin-right: 10px; }
    .controls button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .controls button:hover { background: #0056b3; }
    
    /* 题目区域样式 */
    #problem-container { 
        display: none;
        width: 100%;
        margin: 0 auto;
        padding: 10px;
        text-align: center;
    }
    .header-info { 
        text-align: center; 
        margin-bottom: 10px; 
        font-size: 14px; 
    }
    
    /* 一行四列 - 口算题区域 */
    .problem-grid { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr);
        gap: 8px 5px;
        width: 100%;
        padding-left: 30px;
    }
    .problem-item { 
        font-size: 17px;
        height: 28px;
        line-height: 28px;
        text-align: left;
        /* 新增：确保下划线字符显示正常，pre-wrap允许换行但保留空格/下划线 */
        white-space: pre-wrap; 
        /* 如果希望下划线更长，可以在JS里多加几个下划线，或者这里增加字间距 */
        letter-spacing: 0.5px;
    }
    
    /* 竖式计算区域 - 改为横式 */
    .vertical-section { 
        margin-top: 5px;
        margin-bottom: 100px;
        border-top: none;
        padding-top: 20px; 
        padding-bottom: 30px;
        page-break-inside: avoid;
    }
    .vertical-title { 
        font-weight: bold; 
        font-size: 15px; 
        margin-bottom: 5px;
        text-align: left;
    }
    .vertical-grid { 
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px 40px;
    }
    .vertical-item { 
        font-size: 17px; 
        line-height: 2.8;
        text-align: left;
        padding-left: 20px;
    }
    
    /* 除法竖式专用样式 */
    .division-section {
        margin-top: 100px;
        margin-bottom: 50px;
        border-top: none;
        padding-top: 25px;
        padding-bottom: 25px;
        page-break-inside: avoid;
    }
    .division-title {
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 10px;
        text-align: left;
    }
    .division-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px 40px;
    }
    .division-item {
        font-size: 17px;
        line-height: 3;
        text-align: left;
        padding-left: 20px;
    }

    /* 打印专用样式 */
    @media print {
        .controls { display: none; }
        #problem-container { 
            display: block !important;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body { 
            padding: 0; 
            margin: 0;
            width: 100%;
            max-width: none;
        }
        .problem-grid { 
            gap: 6px 5px;
            padding-left: 20px;
        }
        .problem-item {
            height: 24px;
            line-height: 24px;
            font-size: 13px;
        }
        .header-info {
            margin-bottom: 5px;
            font-size: 14px;
            padding-bottom: 20px;
        }
        
        /* 竖式计算区域 - 打印优化 */
        .vertical-section {
            margin-top: 5mm;
            margin-bottom: 8mm;
            padding-top: 5mm;
            padding-bottom: 20mm;
            border-top: none;
        }
        .vertical-title {
            font-size: 15px;
            margin-bottom: 1mm;
        }
        .vertical-grid {
            gap: 12mm 50px;
        }
        .vertical-item {
            font-size: 16px;
            line-height: 2.8;
        }
        
        /* 除法竖式区域 - 打印优化 */
        .division-section {
            margin-top: 5mm;
            margin-bottom: 5mm;
            padding-top: 5mm;
            padding-bottom: 12mm;
            border-top: none;
        }
        .division-title {
            font-size: 15px;
            margin-bottom: 1mm;
        }
        .division-grid {
            gap: 12mm 50px;
        }
        .division-item {
            font-size: 16px;
            line-height: 2.8;
        }
        
        @page {
            margin: 10mm;
            size: A4;
        }
        
        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }
</style>
</head>
<body>

<div class="controls" style="margin: 0 auto; width: 210mm;">
    <h3>🛠️ 设置面板</h3>
    <label>口算题数：</label>
    <input type="number" id="numInput" value="60" min="1" max="100">
    <button onclick="generateAndPrint()">生成并下载 PDF</button>
    <p style="font-size: 12px; color: #666; margin-top: 5px;">
        * 打印时请<b>取消勾选"页眉和页脚"</b>选项，以确保无页脚输出
    </p>
</div>

<div id="problem-container">
    <div class="header-info">
        姓名：________________ &nbsp;&nbsp;&nbsp; 日期：________________ &nbsp;&nbsp;&nbsp; 用时：________________
    </div>
    <div class="problem-grid" id="problemGrid"></div>
    
    <div class="vertical-section">
        <div class="vertical-title">竖式计算：</div>
        <div class="vertical-grid" id="verticalGrid"></div>
    </div>

    <div class="division-section">
        <div class="division-title">除法竖式：</div>
        <div class="division-grid" id="divisionGrid"></div>
    </div>
</div>

<script>
    // 工具函数：生成范围内的随机整数
    function randint(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 预先生成乘法口诀表范围内的除法题示例
    let multiplicationTableDivisions = [];
    function initDivisionData() {
        multiplicationTableDivisions = [];
        for (let divisor = 2; divisor < 10; divisor++) {
            for (let quotient = 2; quotient < 10; quotient++) {
                let dividend = divisor * quotient;
                if (dividend >= 2 && dividend <= 81) {
                    multiplicationTableDivisions.push({ dividend, divisor, quotient });
                }
            }
        }
    }

    // 核心逻辑：生成题目
    function generateMathProblems(numProblems = 60) {
        const MAX_PROBLEMS = 80;
        // 稍微放宽限制，因为布局更紧凑了，但依然保持安全上限
        if (numProblems > MAX_PROBLEMS) {
            numProblems = MAX_PROBLEMS;
            alert(`题目数量已自动调整为${MAX_PROBLEMS}道，以确保一页能放下`);
        }
        
        let problems = [];
        let seenProblems = new Set();
        
        const problemTypes = [
            { type: 'two_num_add', weight: 10 },
            { type: 'two_num_add_fill', weight: 5 },
            { type: 'two_num_sub', weight: 10 },
            { type: 'two_num_sub_fill', weight: 5 },
            { type: 'multiply', weight: 20 },
            { type: 'multiply_fill', weight: 13 },
            { type: 'triple_add', weight: 0 },
            { type: 'triple_sub', weight: 0 },
            { type: 'mixed_three', weight: 2 },
            { type: 'comparison_expr', weight: 1 },
            { type: 'compare_num_expr', weight: 1 },
            { type: 'divide', weight: 18 },
            { type: 'divide_fill', weight: 15 }
        ];

        let typeQueue = [];
        problemTypes.forEach(item => {
            if (item.weight > 0) {
                for (let i = 0; i < item.weight; i++) typeQueue.push(item.type);
            }
        });

        typeQueue.sort(() => Math.random() - 0.5);

        let queueIndex = 0;
        while (problems.length < numProblems) {
            if (queueIndex >= typeQueue.length) {
                typeQueue.sort(() => Math.random() - 0.5);
                queueIndex = 0;
            }

            let operation = typeQueue[queueIndex];
            queueIndex++;

            let problem = null;
            let attempts = 0;
            const maxAttempts = 10;

            while ((problem === null || seenProblems.has(problem)) && attempts < maxAttempts) {
                attempts++;
                problem = createSingleProblem(operation);
            }

            if (problem && !seenProblems.has(problem)) {
                problems.push(problem);
                seenProblems.add(problem);
            }
        }

        // 生成 2 道万以内竖式题目
        let verticalProblems = [];
        let va_num1 = randint(1000, 8999);
        let va_num2 = randint(100, 9999 - va_num1);
        verticalProblems.push({ type: 'add', num1: va_num1, num2: va_num2 });

        let vs_num1 = randint(2000, 9999);
        let vs_num2 = randint(100, vs_num1);
        verticalProblems.push({ type: 'sub', num1: vs_num1, num2: vs_num2 });

        // 生成2道商是个位数且有余数的除法竖式
        let divisionProblems = [];
        for (let i = 0; i < 2; i++) {
            let divisor = randint(2, 9); // 除数：1位数（2-9）
            let quotient = randint(1, 9); // 商：个位数（1-9）
            let remainder = randint(1, divisor - 1); // 余数：1到(除数-1)，确保有余数且余数<除数
            let dividend = divisor * quotient + remainder; // 被除数 = 除数 × 商 + 余数

            divisionProblems.push({
                type: 'div',
                dividend: dividend,
                divisor: divisor
            });
        }

        return { problems, verticalProblems, divisionProblems };
    }

        // 生成单道题目
    function createSingleProblem(operation) {
        if (operation === 'two_num_add') {
            let a = randint(2, 99);
            let b = randint(2, 100 - a);
            if (b < 2) return null;
            return `${a} + ${b} =`;
        
        } else if (operation === 'two_num_add_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let a = randint(2, 99);
            let b = randint(2, 100 - a);
            if (b < 2) return null;
            return fillPosition === 'first' ? `______ + ${b} = ${a + b}` : `${a} + ______ = ${a + b}`;

        } else if (operation === 'two_num_sub') {
            let a = randint(3, 100);
            let b = randint(2, a - 1);
            if (b < 2) return null;
            return `${a} - ${b} =`;
        
        } else if (operation === 'two_num_sub_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let a = randint(3, 100);
            let b = randint(2, a - 1);
            if (b < 2) return null;
            return fillPosition === 'first' ? `______ - ${b} = ${a - b}` : `${a} - ______ = ${a - b}`;

        } else if (operation === 'multiply') {
            let m1 = randint(2, 9);
            let m2 = randint(2, 9);
            return `${m1} × ${m2} =`;
        
        } else if (operation === 'multiply_fill') {
            let fillPosition = Math.random() > 0.5 ? 'first' : 'second';
            let m1 = randint(2, 9);
            let m2 = randint(2, 9);
            let res = m1 * m2;
            return fillPosition === 'first' ? `${m1} × ______ = ${res}` : `______ × ${m2} = ${res}`;

        } else if (operation === 'divide') {
            if (multiplicationTableDivisions.length === 0) return null;
            let item = multiplicationTableDivisions[randint(0, multiplicationTableDivisions.length - 1)];
            return `${item.dividend} ÷ ${item.divisor} =`;
        
        } else if (operation === 'divide_fill') {
            if (multiplicationTableDivisions.length === 0) return null;
            let item = multiplicationTableDivisions[randint(0, multiplicationTableDivisions.length - 1)];
            let pos = Math.random();
            if (pos < 0.33) return `______ ÷ ${item.divisor} = ${item.quotient}`;
            else if (pos < 0.66) return `${item.dividend} ÷ ______ = ${item.quotient}`;
            else return `${item.dividend} ÷ ${item.divisor} = ______`;
        } 
        
        else if (operation === 'mixed_three') {
             let pattern = Math.random() > 0.5 ? '+-' : '-+';
            if (pattern === '+-') {
                let a = randint(2, 70);
                let b = randint(2, Math.min(30, 100 - a));
                let c = randint(2, Math.min(30, a + b));
                return `${a} + ${b} - ${c} =`;
            } else {
                let a = randint(10, 70);
                let b = randint(2, Math.min(30, a));
                let cMax = Math.min(30, 100 - (a - b));
                let c = cMax > 1 ? randint(2, cMax) : 0;
                return c > 0 ? `${a} - ${b} + ${c} =` : `${a} - ${b} =`;
            }
        } else if (operation === 'comparison_expr') {
            let v1 = randint(10, 90);
            let v2 = randint(10, 90);
            return `${v1} + ${randint(2,9)} ◯ ${v2} - ${randint(2,9)}`;
        } else if (operation === 'compare_num_expr') {
            let val = randint(10, 90);
            let num = val + randint(-3, 3);
            return Math.random() > 0.5 ? `${num} ○ ${val} + ${randint(1,5)}` : `${val} + ${randint(1,5)} ○ ${num}`;
        }
        return null;
    }
    // 渲染加减法竖式题目
    function renderVerticalProblems(verticalProblems) {
        const vGrid = document.getElementById('verticalGrid');
        vGrid.innerHTML = '';
        
        verticalProblems.forEach(prob => {
            let container = document.createElement('div');
            container.className = 'vertical-item';
            
            if (prob.type === 'add') {
                let op = '+';
                let n1 = prob.num1;
                let n2 = prob.num2;
                container.innerHTML = `${n1} ${op} ${n2} = `;
            } else if (prob.type === 'sub') {
                let op = '-';
                let n1 = prob.num1;
                let n2 = prob.num2;
                container.innerHTML = `${n1} ${op} ${n2} = `;
            }
            
            vGrid.appendChild(container);
        });
    }

    // 渲染除法竖式题目（不带答案）
    function renderDivisionProblems(divisionProblems) {
        const dGrid = document.getElementById('divisionGrid');
        dGrid.innerHTML = '';
        
        divisionProblems.forEach(prob => {
            let container = document.createElement('div');
            container.className = 'division-item';
            
            // 除法格式：被除数 ÷ 除数 = （留空给学生填写）
            container.innerHTML = `${prob.dividend} ÷ ${prob.divisor} = `;
            
            dGrid.appendChild(container);
        });
    }

    // 渲染题目到页面
    function renderProblems(problems, verticalProblems, divisionProblems = []) {
        const grid = document.getElementById('problemGrid');
        grid.innerHTML = '';
        problems.forEach(p => {
            let div = document.createElement('div');
            div.className = 'problem-item';
            div.textContent = p;
            grid.appendChild(div);
        });

        renderVerticalProblems(verticalProblems);
        renderDivisionProblems(divisionProblems);

        document.getElementById('problem-container').style.display = 'block';
    }

    // 主流程：生成并触发打印
    function generateAndPrint() {
        // 初始化除法数据
        initDivisionData();
        
        // 获取用户输入的题目数量
        const num = parseInt(document.getElementById('numInput').value) || 60;
        
        // 生成所有类型的题目，包括口算、加减竖式和除法竖式
        const { problems, verticalProblems, divisionProblems } = generateMathProblems(num);
        
        // 渲染题目到页面
        renderProblems(problems, verticalProblems, divisionProblems);
        
        // 延迟触发打印，确保DOM完全渲染
        setTimeout(() => {
            window.print();
        }, 500);
    }

    // 初始化
    initDivisionData();
</script>

</body>
</html>
